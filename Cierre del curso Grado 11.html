    case 'mark':S.mark[i]=!S.mark[i];S.open[i]=true;break;
    case 'socio':S.socio[i]=!S.socio[i];break;
    case 'can':S.can[i]=!S.can[i];break;
    case 'pf':S.pf[i]=!S.pf[i];break;
    case 'qdone':S.q=S.q||{};S.q[i]=!S.q[i];break;
    case 'ans':if(S.ans[S.qi]===undefined)S.ans[S.qi]=i;break;
    case 'nextq':S.qi=Math.min(QUIZ.length-1,S.qi+1);break;
    case 'spin':var pool=[],j;for(j=0;j<SPIN.length;j++)if(S.used.indexOf(j)<0)pool.push(j);if(!pool.length){S.used=[];for(j=0;j<SPIN.length;j++)if(j!==S.spinIdx)pool.push(j);}var n=pool[Math.floor(Math.random()*pool.length)];S.spinIdx=n;S.spins++;S.used.push(n);break;
    case 'inc':S.sk[k]=(S.sk[k]||0)+1;break;
    case 'dec':S.sk[k]=Math.max(0,(S.sk[k]||0)-1);break;
    case 'rev':S.rev[i]=!S.rev[i];break;
    case 'reset':clearInterval(T.h);T={t:300,run:false,h:null};S=init();save();render();window.scrollTo(0,0);return;
  }
  save();rerender();
});
render();
})();
